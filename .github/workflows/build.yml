
name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicação Android
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tvos-launcher

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Verificar projeto Gradle
        run: |
          echo "Conteúdo da pasta:"
          ls -la
          echo "Verificar ficheiros Gradle:"
          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK Release
        run: gradle assembleRelease --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-apk
          path: tvos-launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

