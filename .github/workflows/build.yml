
name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicação Android
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Verificar pasta do projeto
        run: |
          echo "Pastas existentes:"
          ls -la
          echo "Conteúdo de tvos-launcher:"
          ls -la tvos-launcher

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK Release
        working-directory: tvos-launcher
        run: gradle assembleRelease --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-apk
          path: tvos-launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
